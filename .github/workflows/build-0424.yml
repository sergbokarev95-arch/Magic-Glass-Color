name: Build Magic Glass Color 0.4.24
on:
  push:
    paths:
      - '.github/workflows/build-0424.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python -m pip install cairosvg
      - name: Fetch 0.4.23 base
        run: |
          curl -fL --retry 3 -o Magic_Glass_Color_0.4.23_Farpost_TEST.hnt "https://github.com/sergbokarev95-arch/Magic-Glass-Color/releases/download/v0.4.23/Magic_Glass_Color_0.4.23_Farpost_TEST.hnt"
      - name: Build and verify
        run: python scripts/build_0424.py
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.24
          path: dist/*.hnt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.24 dist/*.hnt --target main --title "Magic Glass Color 0.4.24" --notes "Wildberries: purple wb lettering only, no promotional 11.11, no circle or gradient background. Previous icons preserved." --latest
