name: Build Magic Glass Color 0.4.31
on:
  push:
    paths:
      - '.github/workflows/build-0431.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg pillow
      - name: Fetch previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v0.4.30 --pattern '*.hnt' --dir previous
          test "$(find previous -name '*.hnt' -type f | wc -l)" -eq 1
          cp previous/*.hnt base.hnt
      - name: Build and verify
        run: python scripts/build_0431.py
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.31
          path: dist/*.hnt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.31 dist/*.hnt --target main --title "Magic Glass Color 0.4.31" --notes "AliExpress: fix Android package to ru.aliexpress.buyer. Approved compact orange bag; all other icons preserved." --latest
