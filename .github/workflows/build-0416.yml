name: Build Magic Glass Color 0.4.16
on:
  push:
    paths:
      - '.github/workflows/build-0416.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg
      - name: Fetch 0.4.15 base
        run: |
          curl -fL --retry 3 -o Magic_Glass_Color_0.4.15_Happ_TEST.hnt "https://github.com/sergbokarev95-arch/Magic-Glass-Color/releases/download/v0.4.15/Magic_Glass_Color_0.4.15_Happ_TEST.hnt"
      - name: Build and verify
        run: python scripts/build_0416.py
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.16
          path: dist/*.hnt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.16 dist/*.hnt --target main --title "Magic Glass Color 0.4.16" --notes "Reduced Happ icon by 22% for balanced proportions. All other icons unchanged." --latest
