name: Build Magic Glass Color 0.4.23
on:
  push:
    paths:
      - '.github/workflows/build-0423.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg
      - name: Fetch 0.4.22 base
        run: |
          curl -fL --retry 3 -o Magic_Glass_Color_0.4.22_OZON_TEST.hnt "https://github.com/sergbokarev95-arch/Magic-Glass-Color/releases/download/v0.4.22/Magic_Glass_Color_0.4.22_OZON_TEST.hnt"
      - name: Build and verify
        run: python scripts/build_0423.py
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.23
          path: dist/*.hnt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.23 dist/*.hnt --target main --title "Magic Glass Color 0.4.23" --notes "Farpost: orange Latin F with rounded corners, no circle, transparent background. Previous icons preserved." --latest
