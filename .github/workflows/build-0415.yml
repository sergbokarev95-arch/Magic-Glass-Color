name: Build Magic Glass Color 0.4.15
on:
  push:
    paths:
      - '.github/workflows/build-0415.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install cairosvg
      - name: Fetch verified 0.4.14 base
        run: |
          curl -fL --retry 3 -o Magic_Glass_Color_0.4.14_File_Manager_Plus_TEST.hnt "https://github.com/sergbokarev95-arch/Magic-Glass-Color/releases/download/v0.4.14/Magic_Glass_Color_0.4.14_File_Manager_Plus_TEST.hnt"
      - name: Build and verify 0.4.15
        run: python scripts/build_0415.py
      - uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.15
          path: dist/*.hnt
      - name: Publish 0.4.15 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.4.15 dist/*.hnt --target main --title "Magic Glass Color 0.4.15" --notes "Happ: clean white geometric H with fine graphite outline and transparent background. All other icons preserved." --latest
