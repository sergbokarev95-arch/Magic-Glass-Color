name: Build Magic Glass Color 0.4.14
on:
  push:
    paths:
      - '.github/workflows/build-0414.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install cairosvg
      - name: Build and verify theme
        run: python scripts/build_0414.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Glass-Color-0.4.14
          path: dist/*.hnt
      - name: Attach to existing draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.4.14 dist/*.hnt --clobber
